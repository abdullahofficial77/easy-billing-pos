name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Zip Build Assets (Ready-for-Cloud-Build)
        if: always()
        run: |
          zip -r ready-for-cloud-build.zip android dist package.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          include-hidden-files: true

      - name: Upload Build Assets Zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-for-cloud-build-${{ github.run_id }}
          path: ready-for-cloud-build.zip
          include-hidden-files: true
